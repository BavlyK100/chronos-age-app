<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#0f111e" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6" />
  
  <!-- Hourglass Frame -->
  <path d="M18 14 H46 M18 50 H46" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M22 15 C22 28, 30 31, 32 32 C34 31, 42 28, 42 15 Z" fill="none" stroke="url(#grad)" stroke-width="2.5" />
  <path d="M22 49 C22 36, 30 33, 32 32 C34 33, 42 36, 42 49 Z" fill="none" stroke="url(#grad)" stroke-width="2.5" />
  
  <!-- Falling sand elements -->
  <path d="M25 48 C25 42, 39 42, 39 48 Z" fill="url(#sand)" />
  <circle cx="32" cy="35" r="1.5" fill="#f59e0b" />
  <circle cx="32" cy="39" r="1.5" fill="#f59e0b" />
  
  <!-- Star sparkles -->
  <circle cx="49" cy="18" r="1.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="15" cy="46" r="1.5" fill="#a855f7" filter="url(#glow)" />
</svg>
